execution_budget:
  max_steps: 20
  max_tool_calls: 30
  max_llm_calls: 4
  max_total_runtime_seconds: 1800
  max_retries_per_step: 3
retry:
  max_attempts: 3
  base_delay_seconds: 0.5
  max_delay_seconds: 8
  jitter_seconds: 0.25
circuit_breaker:
  failure_threshold: 3
  recovery_timeout_seconds: 60
  half_open_max_calls: 1
loop_detection:
  identical_call_threshold: 3
worker:
  lease_seconds: 90
  heartbeat_seconds: 20
  poll_seconds: 1
